spring.application.name=file_manager
server.port=8008

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.rateLimitCapacity=rateLimitCapacity

# ─────────────────────────────────────────────
# Provider switch: minio | garage  (run setup.sh to configure)
# ─────────────────────────────────────────────
storage.provider=minio

# MinIO (active when storage.provider=minio)
minio.url=http://localhost:9000
minio.accessKey=
minio.secretKey=
minio.publicBucketName=ecommerce-public
minio.privateBucketName=ecommerce-private
minio.expiry.hours=1

# Garage (active when storage.provider=garage)
garage.url=http://localhost:3900
garage.region=garage
garage.accessKey=
garage.secretKey=
garage.publicBucketName=ecommerce-public
garage.privateBucketName=ecommerce-private
garage.expiry.hours=1

# MongoDB
spring.data.mongodb.uri=mongodb://civaLENs:7EGLHU7Eils6@localhost:27017/file_storage_db?authSource=admin
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.socket-timeout=3000
spring.data.mongodb.connect-timeout=3000

# Shared storage config
storage.multipart.threshold-bytes=10485760
storage.multipart.part-size-bytes=5242880
storage.lifecycle.public.expiry-days=365
storage.lifecycle.private.expiry-days=90
storage.lifecycle.multipart.expiry-days=7
storage.presigned.put.expiry-minutes=15
storage.versioning.enabled=true
storage.encryption.sse-s3.enabled=false
storage.cors.allowed-origins=*
storage.cors.max-age-seconds=3600

# Notifications
storage.notification.listener.enabled=false
storage.notification.polling.enabled=false
storage.notification.polling.interval-ms=30000

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Swagger
springdoc.swagger-ui.disable-swagger-default-url=true
api.response-codes.ok.desc=OK
api.response-codes.badRequest.desc=BAD_REQUEST
api.response-codes.notFound.desc=NOT_FOUND
