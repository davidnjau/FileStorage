storage.provider=minio
minio.url=http://localhost:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.publicBucketName=test-public
minio.privateBucketName=test-private
minio.expiry.hours=1

storage.versioning.enabled=false
storage.encryption.sse-s3.enabled=false
storage.notification.listener.enabled=false
storage.notification.polling.enabled=false
storage.lifecycle.public.expiry-days=0
storage.lifecycle.private.expiry-days=0
storage.lifecycle.multipart.expiry-days=7

spring.data.mongodb.uri=mongodb://localhost:27017/test_file_storage

logging.level.root=WARN
logging.level.com.dave.filestorage=INFO
