# ── MinIO deployment ───────────────────────────────────────────────────
# Usage:
#   docker compose -f docker-compose-minio.yaml --env-file .env up -d

services:

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_network

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  app:
    image: ${APP_IMAGE:-ghcr.io/davidnjau/filestorage:minio}
    container_name: file-storage-app
    ports:
      - "8008:8008"
    environment:
      SPRING_DATA_MONGODB_URI: ${MONGO_URI}
      MINIO_URL: http://minio:9000
      MINIO_PUBLICURL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESSKEY: ${MINIO_ROOT_USER}
      MINIO_SECRETKEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network

volumes:
  minio_data:
  mongo_data:

networks:
  app_network:
    driver: bridge
